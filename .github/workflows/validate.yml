name: Validate extensions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.2"
          extensions: json, mbstring, zip, pdo_sqlite
          coverage: none

      - name: Validate extension sources
        run: |
          php scripts/test.php
          php scripts/validate.php

      - name: Validate release plan
        shell: bash
        run: |
          previous="${RUNNER_TEMP}/catalog.json"
          catalog_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/catalog/catalog.json"
          curl --fail --silent --show-error --location "$catalog_url" --output "$previous" || rm -f "$previous"
          php scripts/build.php --repository="$GITHUB_REPOSITORY" --previous="$previous"
          cat build/release-plan.json
